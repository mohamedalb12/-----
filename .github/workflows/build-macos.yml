name: Build macOS app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["disk_cleaner/**", ".github/workflows/build-macos.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1/M2/M3/M4)
            arch: arm64
          - runner: macos-15-intel    # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: disk_cleaner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app and DMG
        run: |
          chmod +x build_mac.sh
          PYTHON=python ./build_mac.sh

      - name: Self-test the built app on real macOS
        timeout-minutes: 10
        run: '"dist/Disk Cleaner Pro.app/Contents/MacOS/Disk Cleaner Pro" --selftest'

      - uses: actions/upload-artifact@v4
        with:
          name: DiskCleanerPro-macOS-${{ matrix.arch }}
          path: disk_cleaner/dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(python3 -c 'import sys; sys.path.insert(0, "disk_cleaner"); import cleaner; print(cleaner.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dmgs
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Disk Cleaner Pro v${{ steps.version.outputs.version }}
          files: dmgs/*.dmg
          body: |
            ## منظّف القرص برو — Disk Cleaner Pro

            **أي ملف أحمّل؟**
            - ماك بمعالج Apple (M1 / M2 / M3 / M4): ملف `arm64`
            - ماك بمعالج Intel: ملف `x86_64`

            (من قائمة  ← حول هذا الماك ← «الشريحة» أو «المعالج»)

            **التثبيت:** افتح ملف DMG واسحب التطبيق إلى مجلد Applications.

            **أول تشغيل:** التطبيق غير موقّع من Apple، لذلك سيظهر تحذير. افتح
            إعدادات النظام ← الخصوصية والأمان ← انزل للأسفل واضغط «فتح على أي حال».
